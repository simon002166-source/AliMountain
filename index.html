<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>阿里山二天一夜慢活之旅｜互動地圖與導航</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }

    /* GPS 目前位置脈衝動畫 */
    .gps-pulse-wrapper {
      position: relative;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gps-pulse-ring {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: rgba(59, 130, 246, 0.4);
      animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .gps-dot {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #2563eb;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.35);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 0.9; }
      80%, 100% { transform: scale(1.9); opacity: 0; }
    }

    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-[100dvh]">

  <!-- 頂部標題列 -->
  <header class="bg-emerald-900 text-white px-4 py-2.5 shadow-md flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-2.5">
      <i class="fa-solid fa-mountain-sun text-amber-400 text-lg"></i>
      <div>
        <h1 class="text-base md:text-lg font-bold leading-tight">阿里山二天一夜慢活行程</h1>
        <p class="text-[11px] text-emerald-200">11/29 高雄出發・夜宿阿里山閣大飯店（無日出悠閒版）</p>
      </div>
    </div>
    <div id="gps-badge" class="flex items-center gap-1.5 text-xs bg-emerald-800/80 px-2.5 py-1 rounded-full border border-emerald-700">
      <span id="gps-status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
      <span id="gps-status-text">GPS 定位中...</span>
    </div>
  </header>

  <!-- 主內容區：手機版上下各佔 1/2 (h-1/2)，桌面版左右並排 -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden">

    <!-- 地圖區塊：手機螢幕佔比 1/2 (h-1/2) -->
    <section class="relative w-full h-1/2 md:h-full md:w-3/5 shrink-0 border-b md:border-b-0 md:border-r border-slate-300">
      <div id="map" class="w-full h-full z-10"></div>

      <!-- 地圖懸浮控制按鈕 -->
      <div class="absolute bottom-4 right-3 z-[1000] flex flex-col gap-2">
        <button onclick="centerOnUser()" title="定位到我的目前位置"
          class="bg-white hover:bg-blue-50 text-blue-600 border border-slate-300 shadow-lg w-10 h-10 rounded-full flex items-center justify-center transition active:scale-95">
          <i class="fa-solid fa-location-crosshairs text-base"></i>
        </button>
        <button onclick="fitAllMarkers()" title="顯示完整路線"
          class="bg-white hover:bg-emerald-50 text-emerald-800 border border-slate-300 shadow-lg w-10 h-10 rounded-full flex items-center justify-center transition active:scale-95">
          <i class="fa-solid fa-expand text-sm"></i>
        </button>
      </div>
    </section>

    <!-- 行程列表區塊：手機螢幕佔比 1/2 (h-1/2) -->
    <section class="w-full h-1/2 md:h-full md:w-2/5 flex flex-col bg-white overflow-hidden">

      <!-- 天數切換 Tabs -->
      <div class="flex border-b border-slate-200 bg-slate-100 px-2 pt-2 gap-1.5 shrink-0">
        <button onclick="filterDay('all')" id="tab-all"
          class="tab-btn flex-1 py-2 text-xs md:text-sm font-semibold rounded-t-lg bg-white text-emerald-900 border-t border-x border-slate-200 shadow-sm">
          全部行程
        </button>
        <button onclick="filterDay(1)" id="tab-1"
          class="tab-btn flex-1 py-2 text-xs md:text-sm font-semibold rounded-t-lg text-slate-600 hover:bg-white/60">
          Day 1 (11/29)
        </button>
        <button onclick="filterDay(2)" id="tab-2"
          class="tab-btn flex-1 py-2 text-xs md:text-sm font-semibold rounded-t-lg text-slate-600 hover:bg-white/60">
          Day 2 (11/30)
        </button>
      </div>

      <!-- 行程卡片捲動區 -->
      <div id="itinerary-list" class="flex-1 overflow-y-auto p-3 space-y-3">
        <!-- 由 JavaScript 動態渲染 -->
      </div>
    </section>

  </main>

  <script>
    // 1. 行程景點資料
    const stops = [
      {
        id: 'kaohsiung',
        day: 1,
        time: '08:30',
        title: '高雄出發',
        subtitle: '國道三號 ➔ 中埔交流道 ➔ 台18線',
        desc: '準時從高雄出發，沿國道三號北上接台18線阿里山公路，車程約 2.5～3 小時。',
        lat: 22.6273,
        lng: 120.3014,
        color: '#059669',
        icon: 'fa-car'
      },
      {
        id: 'fenqihu',
        day: 1,
        time: '11:30 - 13:30',
        title: '奮起湖車站＆老街',
        subtitle: '午餐：奮起湖便當・百年老街巡禮',
        desc: '漫步百年老街、造訪肖楠母樹林，品嚐鐵路便當、野生愛玉與現烤甜甜圈。',
        lat: 23.5048,
        lng: 120.6951,
        color: '#d97706',
        icon: 'fa-utensils'
      },
      {
        id: 'entrance',
        day: 1,
        time: '14:30 - 15:30',
        title: '阿里山森林遊樂區入口',
        subtitle: '購票入園・轉乘飯店接駁車',
        desc: '於售票亭購票入園並停妥車輛，轉乘阿里山閣大飯店接駁車或園區小火車進入園區。',
        lat: 23.5105,
        lng: 120.8037,
        color: '#059669',
        icon: 'fa-ticket'
      },
      {
        id: 'hotel',
        day: 1,
        time: '15:30 - 18:00',
        title: '阿里山閣大飯店（入住）',
        subtitle: '沼平公園・姊妹潭・受鎮宮午後散步',
        desc: '辦理入住後，步行漫遊鄰近的沼平公園、空中棧道與姊妹潭，享受靜謐高山森林浴。',
        lat: 23.5142,
        lng: 120.8134,
        color: '#dc2626',
        icon: 'fa-bed'
      },
      {
        id: 'giant-trees',
        day: 2,
        time: '09:30 - 11:00',
        title: '巨木群棧道（香林神木）',
        subtitle: '睡到自然醒・千年紅檜森林浴',
        desc: '享用飯店早餐退房後，悠閒步行於巨木群棧道（一期、二期），欣賞壯觀的千年神木群。',
        lat: 23.5122,
        lng: 120.8087,
        color: '#2563eb',
        icon: 'fa-tree'
      },
      {
        id: 'post-office',
        day: 2,
        time: '11:00 - 12:30',
        title: '阿里山郵局 ＆ 商圈午餐',
        subtitle: '全台最高宮殿式郵局・準備賦歸',
        desc: '造訪古色古香的阿里山郵局拍照留念，於商圈享用午餐後搭乘接駁車返回大門口開車下山。',
        lat: 23.5113,
        lng: 120.8065,
        color: '#2563eb',
        icon: 'fa-envelopes-bulk'
      }
    ];

    // 2. 初始化 Leaflet 地圖
    const map = L.map('map', {
      zoomControl: true
    }).setView([23.511, 120.808], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // 3. 建立景點標記與路線
    const markers = {};
    const day1Coords = [];
    const day2Coords = [];

    stops.forEach((stop, index) => {
      if (stop.day === 1) day1Coords.push([stop.lat, stop.lng]);
      if (stop.day === 2) day2Coords.push([stop.lat, stop.lng]);

      const customIcon = L.divIcon({
        className: 'custom-stop-marker',
        html: `
          <div style="background-color:${stop.color};" class="w-8 h-8 rounded-full border-2 border-white shadow-md flex items-center justify-center text-white text-xs font-bold">
            <i class="fa-solid ${stop.icon}"></i>
          </div>
        `,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -16]
      });

      const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}`;

      const popupHtml = `
        <div class="min-w-[200px] p-1">
          <span class="inline-block px-2 py-0.5 text-[10px] font-bold text-white rounded mb-1" style="background:${stop.color}">
            Day ${stop.day}｜${stop.time}
          </span>
          <h3 class="font-bold text-sm text-slate-900 mb-0.5">${stop.title}</h3>
          <p class="text-xs text-slate-600 mb-2">${stop.subtitle}</p>
          <a href="${navUrl}" target="_blank" rel="noopener noreferrer"
             class="block w-full text-center bg-blue-600 hover:bg-blue-700 !text-white text-xs font-semibold py-1.5 px-3 rounded shadow-sm transition">
            <i class="fa-solid fa-diamond-turn-right mr-1"></i> 開啟 Google 導航
          </a>
        </div>
      `;

      const marker = L.marker([stop.lat, stop.lng], { icon: customIcon })
        .addTo(map)
        .bindPopup(popupHtml);

      markers[stop.id] = marker;
    });

    // 繪製路線折線
    const day1Line = L.polyline(day1Coords, { color: '#059669', weight: 4, opacity: 0.75, dashArray: '8, 6' }).addTo(map);
    // Day 2 從飯店出發接續巨木群與郵局
    const day2Line = L.polyline([[23.5142, 120.8134], ...day2Coords], { color: '#2563eb', weight: 4, opacity: 0.75 }).addTo(map);

    // 4. 即時 GPS 定位追蹤
    let userMarker = null;
    let userAccuracyCircle = null;
    let currentUserLatLng = null;

    const gpsDot = document.getElementById('gps-status-dot');
    const gpsText = document.getElementById('gps-status-text');

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          const { latitude, longitude, accuracy } = position.coords;
          currentUserLatLng = [latitude, longitude];

          gpsDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
          gpsText.textContent = `GPS 已連線 (±${Math.round(accuracy)}m)`;

          const gpsIcon = L.divIcon({
            className: 'gps-location-icon',
            html: `<div class="gps-pulse-wrapper"><div class="gps-pulse-ring"></div><div class="gps-dot"></div></div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          if (!userMarker) {
            userMarker = L.marker(currentUserLatLng, { icon: gpsIcon, zIndexOffset: 1000 })
              .addTo(map)
              .bindPopup('<b>您的目前位置</b>');
            userAccuracyCircle = L.circle(currentUserLatLng, {
              radius: accuracy,
              color: '#3b82f6',
              fillColor: '#3b82f6',
              fillOpacity: 0.12,
              weight: 1
            }).addTo(map);
          } else {
            userMarker.setLatLng(currentUserLatLng);
            userAccuracyCircle.setLatLng(currentUserLatLng).setRadius(accuracy);
          }
        },
        (err) => {
          gpsDot.className = 'w-2 h-2 rounded-full bg-rose-400';
          gpsText.textContent = '無法取得 GPS';
          console.warn('Geolocation error:', err.message);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 15000
        }
      );
    } else {
      gpsDot.className = 'w-2 h-2 rounded-full bg-slate-400';
      gpsText.textContent = '不支援 GPS';
    }

    function centerOnUser() {
      if (currentUserLatLng) {
        map.flyTo(currentUserLatLng, 16, { duration: 1 });
        if (userMarker) userMarker.openPopup();
      } else {
        alert('尚未取得您的目前 GPS 座標，請確認已開啟瀏覽器位置權限。');
      }
    }

    function fitAllMarkers() {
      const group = L.featureGroup(Object.values(markers));
      map.fitBounds(group.getBounds().pad(0.15));
    }

    // 5. 渲染行程卡片與互動
    function renderItinerary(dayFilter = 'all') {
      const container = document.getElementById('itinerary-list');
      container.innerHTML = '';

      const filtered = dayFilter === 'all' ? stops : stops.filter(s => s.day === dayFilter);

      filtered.forEach(stop => {
        const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}`;
        const badgeBg = stop.day === 1 ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800';

        const card = document.createElement('div');
        card.className = 'border border-slate-200 rounded-xl p-3 bg-white hover:border-emerald-500 hover:shadow-md transition cursor-pointer';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div onclick="focusStop('${stop.id}')" class="flex-1">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${badgeBg}">Day ${stop.day}</span>
                <span class="text-xs font-semibold text-slate-500"><i class="fa-regular fa-clock mr-1"></i>${stop.time}</span>
              </div>
              <h3 class="font-bold text-slate-900 text-sm md:text-base">${stop.title}</h3>
              <p class="text-xs font-medium text-emerald-700 mt-0.5">${stop.subtitle}</p>
              <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">${stop.desc}</p>
            </div>
            <a href="${navUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()"
               class="shrink-0 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm flex flex-col items-center justify-center gap-1 transition active:scale-95">
              <i class="fa-solid fa-diamond-turn-right text-sm"></i>
              <span>導航</span>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function focusStop(id) {
      const stop = stops.find(s => s.id === id);
      if (!stop) return;
      map.flyTo([stop.lat, stop.lng], 16, { duration: 1 });
      markers[id].openPopup();
    }

    function filterDay(day) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn flex-1 py-2 text-xs md:text-sm font-semibold rounded-t-lg text-slate-600 hover:bg-white/60';
      });
      const activeBtn = document.getElementById(`tab-${day}`);
      activeBtn.className = 'tab-btn flex-1 py-2 text-xs md:text-sm font-semibold rounded-t-lg bg-white text-emerald-900 border-t border-x border-slate-200 shadow-sm';

      renderItinerary(day);

      if (day === 1) {
        map.fitBounds(day1Line.getBounds().pad(0.15));
      } else if (day === 2) {
        map.fitBounds(day2Line.getBounds().pad(0.25));
      } else {
        // 預設聚焦在阿里山遊樂區核心範圍
        map.setView([23.512, 120.808], 15);
      }
    }

    // 初始化畫面
    renderItinerary('all');
    // 確保容器尺寸正確計算
    setTimeout(() => { map.invalidateSize(); }, 200);
  </script>
</body>
</html>
